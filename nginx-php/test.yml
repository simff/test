---
-
  become: true
  hosts: hosts
  become_method: sudo
  become_user: root
  tasks:
  - name: Update APT
    apt:
      update_cache: yes

  - name: Install python3-pip
    apt:
      name:
        - python3-pip

  - name: Add pexpect for Python3
    shell: pip3 install pexpect --break-system-packages
