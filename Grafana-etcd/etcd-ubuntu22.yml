---
-
  become: true
  hosts: etcd
  become_method: sudo
  become_user: root
  tasks:
  - name: Update APT
    apt:
      update_cache: yes

  - name: Install etcd
    apt:
      name:
        - etcd

  - name: Restart etcd
    service:
      name: "etcd"
      daemon_reload: true
      state: "restarted"
      enabled: "yes"
